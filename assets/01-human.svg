<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img"><title>01 / Beneath the surface — Anees Imran</title><defs><linearGradient id="sea"><stop stop-color="#087c9f"/><stop offset="1" stop-color="#56cbe0"/></linearGradient><radialGradient id="haze"><stop stop-color="#087c9f" stop-opacity=".24"/><stop offset="1" stop-color="#07131f" stop-opacity="0"/></radialGradient></defs><style>.edge{stroke-dasharray:160 2200;animation:edge 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.turn{transform-origin:930px 160px;animation:turn 18s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.blink{animation:pulse 1.4s steps(2,end) infinite}@keyframes edge{to{stroke-dashoffset:-2360}}@keyframes pulse{50%{opacity:.25}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="2" y="2" width="1196" height="356" rx="18" fill="#07131f" stroke="#174255"/><rect class="edge" x="3" y="3" width="1194" height="354" rx="18" fill="none" stroke="#55c5df" stroke-width="2"/><text x="40" y="45" fill="#54c3de" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="3">01 / BENEATH THE SURFACE</text><text x="40" y="106" fill="#e1f5fa" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">The handle is Omeganees.</text><text x="40" y="151" fill="#e1f5fa" font-family="Arial,Helvetica,sans-serif" font-size="38" font-weight="700">The curiosity is personal.</text><text x="40" y="205" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="23" >I'm Anees Imran. I like the moment an idea stops</text><text x="40" y="238" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="23" >being a sketch and starts answering back.</text><text x="40" y="290" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="21" >A strange little interaction. One detail you almost miss.</text><text x="40" y="321" fill="#61c9e0" font-family="Arial,Helvetica,sans-serif" font-size="21" >Then you notice it — and try it again.</text><circle cx="930" cy="160" r="150" fill="url(#haze)"/><circle cx="930" cy="160" r="45" fill="none" stroke="#22576b"/><circle cx="930" cy="160" r="80" fill="none" stroke="#22576b"/><circle cx="930" cy="160" r="115" fill="none" stroke="#22576b"/><path d="M800 160H1060M930 30V290" stroke="#153b50"/><g class="turn"><path d="M930 160L1045 160A115 115 0 0 0 930 45Z" fill="#29a8cb" opacity=".12"/><path d="M930 160L1045 160" stroke="#52c7df"/></g><circle class="pulse" cx="984" cy="104" r="6" fill="#79dbed"/><text x="874" y="315" fill="#6ba6ba" font-family="Arial,Helvetica,sans-serif" font-size="13" letter-spacing="2">STILL CURIOUS.</text></svg>