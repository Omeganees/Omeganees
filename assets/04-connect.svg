<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="230" viewBox="0 0 1200 230" role="img"><title>Have a beautifully unreasonable idea? Tell me the part you cannot stop thinking about. Say hello.</title><defs><linearGradient id="sea"><stop stop-color="#087c9f"/><stop offset="1" stop-color="#56cbe0"/></linearGradient><radialGradient id="haze"><stop stop-color="#087c9f" stop-opacity=".24"/><stop offset="1" stop-color="#07131f" stop-opacity="0"/></radialGradient></defs><style>.edge{stroke-dasharray:160 2200;animation:edge 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.turn{transform-origin:930px 160px;animation:turn 18s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.blink{animation:pulse 1.4s steps(2,end) infinite}@keyframes edge{to{stroke-dashoffset:-2360}}@keyframes pulse{50%{opacity:.25}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="2" y="2" width="1196" height="226" rx="18" fill="#07131f" stroke="#174255"/><rect class="edge" x="3" y="3" width="1194" height="224" rx="18" fill="none" stroke="#55c5df" stroke-width="2"/><text x="40" y="43" fill="#54c3de" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="3">04 / NEXT TRANSMISSION</text><text x="40" y="99" fill="#e1f5fa" font-family="Arial,Helvetica,sans-serif" font-size="37" font-weight="700">Have a beautifully unreasonable idea?</text><text x="40" y="144" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="23" >Skip the polished pitch. Tell me the part you cannot stop thinking about.</text><text x="40" y="194" fill="#61c9e0" font-family="Arial,Helvetica,sans-serif" font-size="21" >anees.imran@outlook.com</text><circle cx="1115" cy="172" r="30" fill="#0b2a3b" stroke="#328daa"/><g class="pulse"><text x="1101" y="184" fill="#8edfeb" font-family="Arial,Helvetica,sans-serif" font-size="38" >↗</text></g></svg>