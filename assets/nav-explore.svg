<svg xmlns="http://www.w3.org/2000/svg" width="380" height="110" viewBox="0 0 380 110" role="img"><title>EXPLORE</title><defs><linearGradient id="sea"><stop stop-color="#087c9f"/><stop offset="1" stop-color="#56cbe0"/></linearGradient><radialGradient id="haze"><stop stop-color="#087c9f" stop-opacity=".24"/><stop offset="1" stop-color="#07131f" stop-opacity="0"/></radialGradient></defs><style>.edge{stroke-dasharray:160 2200;animation:edge 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.turn{transform-origin:930px 160px;animation:turn 18s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.blink{animation:pulse 1.4s steps(2,end) infinite}@keyframes edge{to{stroke-dashoffset:-2360}}@keyframes pulse{50%{opacity:.25}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="2" y="2" width="376" height="106" rx="18" fill="#07131f" stroke="#174255"/><rect class="edge" x="3" y="3" width="374" height="104" rx="18" fill="none" stroke="#55c5df" stroke-width="2"/><rect x="18" y="20" width="68" height="70" rx="12" fill="#0b2a3b"/><text x="38" y="67" fill="#58c8e1" font-family="Arial,Helvetica,sans-serif" font-size="32" >⌘</text><text x="105" y="47" fill="#d8f5fa" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" letter-spacing="1">EXPLORE</text><text x="105" y="76" fill="#6ca6ba" font-family="Arial,Helvetica,sans-serif" font-size="12" letter-spacing="1.5">FOLLOW THE CURIOSITY</text><text x="342" y="52" fill="#58c8e1" font-family="Arial,Helvetica,sans-serif" font-size="23" >↗</text></svg>