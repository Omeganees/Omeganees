<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img"><title>02 / The build loop — follow the what if</title><defs><linearGradient id="sea"><stop stop-color="#087c9f"/><stop offset="1" stop-color="#56cbe0"/></linearGradient><radialGradient id="haze"><stop stop-color="#087c9f" stop-opacity=".24"/><stop offset="1" stop-color="#07131f" stop-opacity="0"/></radialGradient></defs><style>.edge{stroke-dasharray:160 2200;animation:edge 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.turn{transform-origin:930px 160px;animation:turn 18s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.blink{animation:pulse 1.4s steps(2,end) infinite}@keyframes edge{to{stroke-dashoffset:-2360}}@keyframes pulse{50%{opacity:.25}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="2" y="2" width="1196" height="376" rx="18" fill="#07131f" stroke="#174255"/><rect class="edge" x="3" y="3" width="1194" height="374" rx="18" fill="none" stroke="#55c5df" stroke-width="2"/><text x="40" y="45" fill="#54c3de" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="3">02 / THE BUILD LOOP</text><text x="40" y="102" fill="#e1f5fa" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">Every good rabbit hole starts with “what if?”</text><path class="flow" d="M100 166H1090" stroke="#38a5c7" fill="none" stroke-width="2"/><circle cx="58" cy="166" r="19" fill="#0b2a3b" stroke="#43bad7"/><text x="47" y="172" fill="#8edfeb" font-family="Arial,Helvetica,sans-serif" font-size="15" >01</text><text x="40" y="234" fill="#e1f5fa" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">CHASE IT.</text><text x="40" y="278" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="20" >Start with the idea that</text><text x="40" y="308" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="20" >will not leave you alone.</text><circle cx="453" cy="166" r="19" fill="#0b2a3b" stroke="#43bad7"/><text x="442" y="172" fill="#8edfeb" font-family="Arial,Helvetica,sans-serif" font-size="15" >02</text><text x="435" y="234" fill="#e1f5fa" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">MAKE IT REAL.</text><text x="435" y="278" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="20" >Trade a perfect imaginary thing</text><text x="435" y="308" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="20" >for a working, imperfect one.</text><circle cx="848" cy="166" r="19" fill="#0b2a3b" stroke="#43bad7"/><text x="837" y="172" fill="#8edfeb" font-family="Arial,Helvetica,sans-serif" font-size="15" >03</text><text x="830" y="234" fill="#e1f5fa" font-family="Arial,Helvetica,sans-serif" font-size="26" font-weight="700">GIVE IT SOUL.</text><text x="830" y="278" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="20" >Tune the small details</text><text x="830" y="308" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="20" >until it feels unmistakable.</text><text x="40" y="353" fill="#61c9e0" font-family="Arial,Helvetica,sans-serif" font-size="18" >THE FINISH LINE: useful enough to keep. Strange enough to remember.</text></svg>