<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img"><title>03 / The linter has entered witness protection. A fictional incident report.</title><defs><linearGradient id="sea"><stop stop-color="#087c9f"/><stop offset="1" stop-color="#56cbe0"/></linearGradient><radialGradient id="haze"><stop stop-color="#087c9f" stop-opacity=".24"/><stop offset="1" stop-color="#07131f" stop-opacity="0"/></radialGradient></defs><style>.edge{stroke-dasharray:160 2200;animation:edge 14s linear infinite}.pulse{animation:pulse 3s ease-in-out infinite}.turn{transform-origin:930px 160px;animation:turn 18s linear infinite}.flow{stroke-dasharray:8 12;animation:flow 4s linear infinite}.blink{animation:pulse 1.4s steps(2,end) infinite}@keyframes edge{to{stroke-dashoffset:-2360}}@keyframes pulse{50%{opacity:.25}}@keyframes turn{to{transform:rotate(360deg)}}@keyframes flow{to{stroke-dashoffset:-100}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect x="2" y="2" width="1196" height="336" rx="18" fill="#07131f" stroke="#174255"/><rect class="edge" x="3" y="3" width="1194" height="334" rx="18" fill="none" stroke="#55c5df" stroke-width="2"/><text x="40" y="44" fill="#54c3de" font-family="Arial,Helvetica,sans-serif" font-size="15" letter-spacing="2">03 / COMPLETELY UNOFFICIAL INCIDENT REPORT</text><circle class="pulse" cx="1134" cy="39" r="5" fill="#54c3de"/><text x="40" y="106" fill="#e1f5fa" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700">The linter has entered witness protection.</text><path d="M40 136H1160" stroke="#174255"/><text x="40" y="179" fill="#54c3de" font-family="Arial,Helvetica,sans-serif" font-size="19">00:01</text><text x="125" y="179" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="21" >Source code detected. Confidence: unreasonable.</text><text x="40" y="213" fill="#54c3de" font-family="Arial,Helvetica,sans-serif" font-size="19">00:02</text><text x="125" y="213" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="21" >Warning prepared. Warning reconsidering its career.</text><text x="40" y="247" fill="#54c3de" font-family="Arial,Helvetica,sans-serif" font-size="19">00:03</text><text x="125" y="247" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="21" >Developer says: “Okay, but hear me out.”</text><text x="40" y="281" fill="#54c3de" font-family="Arial,Helvetica,sans-serif" font-size="19">00:04</text><text x="125" y="281" fill="#a7c2d0" font-family="Arial,Helvetica,sans-serif" font-size="21" >Curiosity wins. Another experiment begins.</text><text x="40" y="318" fill="#6ca6ba" font-family="Arial,Helvetica,sans-serif" font-size="16" >Fictional incident. Real commitment to making the details count.</text></svg>